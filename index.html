<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magic Dreams | Volvemos pronto</title>
<meta name="description" content="Magic Dreams está en mantenimiento. Visítanos en nuestros locales físicos o síguenos en redes.">
<meta name="robots" content="noindex">
<style>
:root{
  --bg:#06141f; --bg2:#0a3a58; --card:rgba(255,255,255,.07); --line:rgba(255,255,255,.14);
  --text:#f5f2ff; --muted:#b9b0d9; --accent:#2cc0f5; --accent2:#1597c9; --ok:#3ddc97;
}
*{box-sizing:border-box;margin:0}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
  background:radial-gradient(1200px 600px at 80% -10%,var(--bg2),transparent),var(--bg);
  min-height:100vh;line-height:1.5;overflow-x:hidden;
}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
main{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:48px 16px 32px}
header{text-align:center;margin-bottom:40px}
.logo{font-size:clamp(2rem,6vw,3.4rem);font-weight:800;letter-spacing:.02em;
  background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.badge{display:inline-flex;gap:8px;align-items:center;margin:18px 0 10px;padding:6px 14px;border:1px solid var(--line);
  border-radius:99px;font-size:.85rem;color:var(--muted);background:var(--card)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3;transform:scale(1.5)}}
h1{font-size:clamp(1.5rem,4vw,2.3rem);margin-bottom:10px}
header p{color:var(--muted);max-width:560px;margin:0 auto}
#countdown{display:none;justify-content:center;gap:12px;margin-top:24px}
#countdown div{min-width:72px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
#countdown b{display:block;font-size:1.7rem;font-variant-numeric:tabular-nums}
#countdown span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
h2{font-size:1.15rem;margin:36px 0 14px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.controls input{flex:1;min-width:200px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--text);font:inherit}
.controls input:focus{outline:2px solid var(--accent2)}
.controls button{padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--card);backdrop-filter:blur(8px);
  display:flex;flex-direction:column;gap:6px;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-3px);border-color:var(--accent2)}
.card h3{font-size:1.02rem}
.card small{color:var(--muted)}
.card .tag{align-self:flex-start;font-size:.72rem;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.card .tag.open{color:var(--ok);border-color:var(--ok)}
.card a.map{margin-top:auto;padding-top:8px;color:var(--accent);text-decoration:none;font-weight:600;font-size:.9rem}
.card a.map:hover{text-decoration:underline}
.empty{color:var(--muted);padding:12px 0}
.social{display:flex;flex-wrap:wrap;gap:12px}
.social a{display:inline-flex;align-items:center;gap:10px;padding:12px 18px;border-radius:14px;border:1px solid var(--line);
  background:var(--card);color:var(--text);text-decoration:none;font-weight:600;transition:.2s}
.social a:hover{background:linear-gradient(90deg,var(--accent),var(--accent2));border-color:transparent;transform:translateY(-2px)}
.social svg{width:20px;height:20px;fill:currentColor}
footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:48px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<main>
  <header>
    <div class="logo" id="brand">Magic Dreams</div><br>
    <span class="badge"><i class="dot"></i><span id="statusText">Sitio en mantenimiento</span></span>
    <h1 id="title"></h1>
    <p id="message"></p>
    <div id="countdown" aria-live="off">
      <div><b id="cd-d">0</b><span>días</span></div>
      <div><b id="cd-h">0</b><span>horas</span></div>
      <div><b id="cd-m">0</b><span>min</span></div>
      <div><b id="cd-s">0</b><span>seg</span></div>
    </div>
  </header>

  <section>
    <h2>📍 Visítanos en nuestros locales</h2>
    <div class="controls">
      <input id="search" type="search" placeholder="Buscar local o zona…" aria-label="Buscar local">
      <button id="openNow" type="button" aria-pressed="false" hidden>Abiertos ahora</button>
    </div>
    <div class="grid" id="stores"></div>
  </section>

  <section>
    <h2>💬 Síguenos y escríbenos</h2>
    <div class="social" id="social"></div>
  </section>

  <footer id="footer"></footer>
</main>

<script>
/* ============================================================
   CONFIGURACIÓN — edita solo este bloque; la página se genera sola.
   - reopenAt: fecha ISO (ej. "2026-10-12T08:00:00-05:00") para mostrar cuenta regresiva. null = oculto.
   - stores[].hours: opcional, { dias: [0..6] (0=domingo), abre:"10:00", cierra:"20:00" }.
     Si lo defines, se muestra el horario y el estado Abierto/Cerrado en tiempo real (hora de Ecuador).
   - stores[].maps: opcional; si falta se genera un enlace de Google Maps con el nombre.
   - social[]: agrega o quita redes. Instagram/TikTok se omiten hasta que pongas la URL.
   ============================================================ */
const CONFIG = {
  brand: "Magic Dreams",
  title: "Estamos mejorando para ti",
  message: "Ropa y accesorios para toda la familia. Estamos renovando nuestra web, ¡muy pronto estará lista! Mientras tanto, visítanos en nuestros 8 locales por todo Guayaquil.",
  reopenAt: null,
  timezone: "America/Guayaquil",
  city: "Guayaquil, Ecuador",
  stores: [
    { name: "Mall del Norte",   place: "Mall del Norte",   address: "Av. Francisco de Orellana, Planta alta" },
    { name: "Mall del Sur",     place: "Mall del Sur",     address: "Planta Alta, Local 227-228, frente al Patio de Comidas" },
    { name: "CC Malecón 2000",  place: "Malecón 2000",     address: "Calle Olmedo, Galería B6" },
    { name: "CC La Rotonda",    place: "C.C. La Rotonda",  address: "Benjamín Carrión, Isla 19A" },
    { name: "Mall El Fortín",   place: "Mall El Fortín",   address: "Av. Perimetral Norte, Local 236" },
    { name: "CC Albán Borja",   place: "C.C. Albán Borja", address: "Carlos Arosemena 72, entre las oficinas administrativas de ATM y Óptica SOS" },
    { name: "Parque California 2", place: "Parque California 2", address: "Km 11, Vía Daule, Bodega J6 PB." },
    { name: "CC Terminal Terrestre", place: "Terminal Terrestre de Guayaquil", address: "Av. Benjamín Rosales y Av. de las Américas, Terminal Terrestre, planta baja, Local 89, Primera Entrada." }
  ],
  social: [
    { name: "Facebook",  url: "https://www.facebook.com/magicdreams.ecuador/", icon: "facebook" },
    { name: "WhatsApp",  url: "https://wa.me/593984945430?text=Hola%20Magic%20Dreams", icon: "whatsapp" },
    { name: "Correo",    url: "mailto:magicdreams.ecuador@gmail.com", icon: "mail" },
    { name: "Instagram", url: "https://www.instagram.com/magicdreams_ec/", icon: "instagram" },
    { name: "TikTok",    url: "", icon: "tiktok" }
  ]
};

const ICONS = {
  facebook:'<path d="M13.5 22v-8h2.7l.5-3.3h-3.2V8.6c0-.9.4-1.7 1.8-1.7h1.5V4.1S15.5 4 14.4 4c-2.5 0-4.1 1.5-4.1 4.2v2.5H7.6V14h2.7v8z"/>',
  instagram:'<path d="M12 7.2A4.8 4.8 0 1 0 12 16.8 4.8 4.8 0 0 0 12 7.2zm0 7.9a3.1 3.1 0 1 1 0-6.2 3.1 3.1 0 0 1 0 6.2zM17.3 6.1a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.2zM12 3c-2.4 0-2.7 0-3.7.1-3.2.1-4.7 1.7-4.9 4.9C3.3 9 3.3 9.3 3.3 12s0 3 .1 3.9c.2 3.200 1.7 4.700 4.900 4.900 1 .1 1.300.1 3.700.1s2.700 0 3.700-.1c3.200-.2 4.700-1.700 4.900-4.900.1-1 .1-1.300.1-3.900s0-2.900-.1-3.900c-.2-3.200-1.700-4.700-4.900-4.900C14.700 3 14.400 3 12 3zm0 1.600c2.400 0 2.700 0 3.600.1 2.200.1 3.300 1.200 3.400 3.400.1.900.1 1.200.1 3.600s0 2.700-.1 3.600c-.1 2.200-1.200 3.300-3.400 3.400-.9.100-1.200.1-3.600.1s-2.700 0-3.600-.1c-2.200-.1-3.300-1.200-3.400-3.400-.1-.9-.1-1.200-.1-3.600s0-2.700.1-3.600C5 5.900 6.100 4.800 8.400 4.700c.9-.1 1.200-.1 3.600-.1z"/>',
  tiktok:'<path d="M16.6 3h-2.9v12.3a2.600 2.600 0 1 1-2.600-2.600c.3 0 .5 0 .8.1V9.800a5.600 5.600 0 1 0 4.700 5.500V9a6.800 6.800 0 0 0 3.900 1.200V7.300A3.900 3.900 0 0 1 16.600 3z"/>',
  whatsapp:'<path d="M12 2a10 10 0 0 0-8.600 15L2 22l5.200-1.400A10 10 0 1 0 12 2zm5.800 14.200c-.2.700-1.400 1.300-1.900 1.300-.5.100-1.100.100-1.800-.1-.4-.1-1-.3-1.700-.6-3-1.300-4.900-4.300-5-4.500-.1-.2-1.200-1.600-1.200-3s.8-2.100 1-2.400c.3-.3.600-.3.800-.3h.6c.2 0 .4 0 .6.500l.8 2c.1.200.1.300 0 .5l-.3.500-.4.400c-.1.100-.3.300-.1.600.2.300.7 1.200 1.600 1.900 1.100 1 2 1.300 2.300 1.400.3.100.4.100.6-.1l.8-1c.2-.3.400-.2.600-.1l1.900.9c.3.100.5.200.5.300.1.200.1.800-.1 1.500z"/>',
  mail:'<path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm9 7.200L4.500 7v.1L12 12.200 19.500 7.100V7z"/>',
  link:'<path d="M10.600 13.400a1 1 0 0 1 0-1.400l3-3a3 3 0 1 1 4.200 4.200l-1.500 1.500-1.400-1.400 1.500-1.500a1 1 0 0 0-1.400-1.400l-3 3a1 1 0 0 1-1.400 0zM13.400 10.600a1 1 0 0 1 0 1.400l-3 3a3 3 0 1 1-4.200-4.200l1.500-1.500 1.400 1.400-1.500 1.500a1 1 0 0 0 1.400 1.400l3-3a1 1 0 0 1 1.400 0z"/>'
};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* Hora actual en la zona horaria configurada */
function nowInTZ(){
  const p = new Intl.DateTimeFormat("en-US",{timeZone:CONFIG.timezone,weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());
  const g = t => p.find(x=>x.type===t).value;
  return { day:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(g("weekday")), min:(+g("hour")%24)*60 + +g("minute") };
}
const toMin = hhmm => { const [h,m]=hhmm.split(":").map(Number); return h*60+m; };
const DAYS = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];

function isOpen(s){
  if(!s.hours) return null;
  const n = nowInTZ();
  return s.hours.dias.includes(n.day) && n.min >= toMin(s.hours.abre) && n.min < toMin(s.hours.cierra);
}
function hoursLabel(h){
  const d = h.dias.slice().sort();
  const days = d.length===7 ? "Todos los días" : d.map(x=>DAYS[x]).join(", ");
  return `${days} · ${h.abre}–${h.cierra}`;
}
function mapsUrl(s){
  return s.maps || "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(`Magic Dreams ${s.place||s.name}, ${CONFIG.city}`);
}

/* ---- Locales ---- */
let onlyOpen = false;
function renderStores(){
  const q = $("search").value.trim().toLowerCase();
  const list = CONFIG.stores.filter(s =>
    (!q || (s.name+" "+(s.place||"")+" "+(s.address||"")).toLowerCase().includes(q)) &&
    (!onlyOpen || isOpen(s) === true));
  $("stores").innerHTML = list.length ? list.map(s => {
    const open = isOpen(s);
    return `<article class="card">
      <h3>${esc(s.name)}</h3>
      ${s.address ? `<small>${esc(s.address)}</small>` : (s.place && s.place!==s.name ? `<small>${esc(s.place)}</small>` : "")}
      ${s.hours ? `<small>🕒 ${esc(hoursLabel(s.hours))}</small>` : ""}
      ${s.phone ? `<small>📞 <a href="tel:${esc(s.phone)}" style="color:inherit">${esc(s.phone)}</a></small>` : ""}
      ${open===null ? "" : `<span class="tag ${open?"open":""}">${open?"Abierto ahora":"Cerrado"}</span>`}
      <a class="map" href="${esc(mapsUrl(s))}" target="_blank" rel="noopener">Cómo llegar →</a>
    </article>`;
  }).join("") : `<p class="empty">No encontramos locales con ese criterio.</p>`;
}

/* ---- Redes ---- */
function renderSocial(){
  $("social").innerHTML = CONFIG.social.filter(s => s.url).map(s =>
    `<a href="${esc(s.url)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[s.icon]||ICONS.link}</svg>${esc(s.name)}</a>`
  ).join("");
}

/* ---- Cuenta regresiva ---- */
function startCountdown(){
  if(!CONFIG.reopenAt) return;
  const end = new Date(CONFIG.reopenAt).getTime();
  if(isNaN(end)) return;
  $("countdown").style.display = "flex";
  const tick = () => {
    const diff = Math.max(0, end - Date.now());
    $("cd-d").textContent = Math.floor(diff/864e5);
    $("cd-h").textContent = Math.floor(diff%864e5/36e5);
    $("cd-m").textContent = Math.floor(diff%36e5/6e4);
    $("cd-s").textContent = Math.floor(diff%6e4/1e3);
    if(diff===0){ $("statusText").textContent = "¡Ya casi! Recarga la página"; clearInterval(t); }
  };
  const t = setInterval(tick, 1000); tick();
}

/* ---- Fondo animado ---- */
function stars(){
  const c = $("stars"), x = c.getContext("2d");
  if(matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  let w,h,pts;
  const init = () => { w=c.width=innerWidth; h=c.height=innerHeight;
    pts = Array.from({length:Math.min(90,Math.floor(w*h/16000))},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.6+.3,v:Math.random()*.25+.05,a:Math.random()})); };
  const loop = () => { x.clearRect(0,0,w,h);
    for(const p of pts){ p.y-=p.v; p.a+=.02; if(p.y<-5){p.y=h+5;p.x=Math.random()*w}
      x.globalAlpha=.35+.35*Math.sin(p.a); x.fillStyle="#fff"; x.beginPath(); x.arc(p.x,p.y,p.r,0,7); x.fill(); }
    requestAnimationFrame(loop); };
  addEventListener("resize",init); init(); loop();
}

/* ---- Init ---- */
document.title = `${CONFIG.brand} | Volvemos pronto`;
$("brand").textContent = CONFIG.brand;
$("title").textContent = CONFIG.title;
$("message").textContent = CONFIG.message;
$("footer").textContent = `© ${new Date().getFullYear()} ${CONFIG.brand} · ${CONFIG.city}`;
if(CONFIG.stores.some(s => s.hours)) $("openNow").hidden = false;
$("search").addEventListener("input", renderStores);
$("openNow").addEventListener("click", e => {
  onlyOpen = !onlyOpen; e.target.setAttribute("aria-pressed", onlyOpen);
  e.target.style.borderColor = onlyOpen ? "var(--ok)" : ""; renderStores();
});
renderStores(); renderSocial(); startCountdown(); stars();
setInterval(renderStores, 60000); /* refresca Abierto/Cerrado cada minuto */
</script>
</body>
</html>
